
services:
  db:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   restart: always
  #   environment:
  #     MINIO_ROOT_USER: minio
  #     MINIO_ROOT_PASSWORD: minio123
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data_hack:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - TELEGRAM_PARSER_CWD=/app
      - STATEMENT_SCORING_DIR=/app/statement_scoring/src
      - STATEMENT_UPLOAD_DIR=/app/uploads
    volumes:
      # Загруженные выписки переживают пересборку контейнера.
      - statement_uploads:/app/uploads
    depends_on:
      - db

    ports:
    - "8001:8000"

volumes:
  # minio_data_hack:
  postgres_data:
  statement_uploads:
